name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned FFmpeg and Inno Setup
        shell: pwsh
        run: |
          $tools = .\scripts\Install-CiTools.ps1 -InstallInno
          $tools.FfmpegDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $tools.InnoDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-PowerShellSyntax.ps1

      - name: Run standalone validation and build installer
        shell: pwsh
        run: .\scripts\Invoke-Validation.ps1 -BuildInstaller

      - name: Verify checkout remains clean
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "Validation changed the checkout:`n$($dirty -join "`n")" }
