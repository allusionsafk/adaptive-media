name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      installer_smoke_test:
        description: Run the isolated install/upgrade/uninstall smoke test
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned FFmpeg and Inno Setup
        shell: pwsh
        run: |
          $tools = .\scripts\Install-CiTools.ps1 -InstallInno
          $tools.FfmpegDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $tools.InnoDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run standalone validation and build candidate
        shell: pwsh
        run: |
          $smoke = '${{ inputs.installer_smoke_test }}' -eq 'true'
          .\scripts\Invoke-Validation.ps1 -BuildInstaller -InstallerSmokeTest:$smoke

      - name: Verify checkout remains clean
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "Candidate build changed the checkout:`n$($dirty -join "`n")" }

      - name: Upload candidate bits without publishing a release
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-media-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/AdaptiveMediaSetup-*-x64.exe
            dist/AdaptiveMediaSetup-*-x64.sha256.txt
            dist/build-provenance.json
