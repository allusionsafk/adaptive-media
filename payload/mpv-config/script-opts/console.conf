# DemiMedia styling for the track, chapter and playlist lists (select.lua,
# drawn by console.lua). Same syntax rules as osc.conf. The list background
# is mpv.conf's osd-outline-color (#151A1E); text uses osd-font and osd-color.
font_size=22
background_alpha=20
padding=14
corner_radius=6
menu_outline_size=1
menu_outline_color=#384247
focused_color=#151A1E
focused_back_color=#C1D0D2
match_color=#7FB3D5
