# DemiMedia in-player controls: mpv's built-in osc.lua (0.41 series).
# Syntax: key=value on its own line. No spaces around '=', no quotes, no
# trailing comments. '#' starts a comment only at the start of a line, so
# colour values need no quoting here. OSC options live in this file, never in
# --script-opts: DemiMedia's launch argv replaces that list.

# A docked bar that stays out of the way: shown on any pointer movement over
# the picture, hidden 1.5 s after the pointer rests (unless it rests on the bar).
layout=bottombar
hidetimeout=1500
fadeduration=180
fadein=yes
deadzonesize=0
minmousemove=3
boxalpha=24
vidscale=auto
scalewindowed=1
scalefullscreen=1
seekbarstyle=bar
seekrangestyle=inverted
timetotal=yes
unicodeminus=yes
chapter_fmt=%s
idlescreen=no
greenandgrumpy=yes
icon_style=fluent

# Subtitles and OSD text move above the bar while it is shown; the video
# rectangle itself never changes (RTX sizing reads it).
dynamic_margins=yes
sub_margins=yes

# DemiMedia colours: bar #151A1E, text #DBE0E2, seek fill #C1D0D2.
background_color=#151A1E
timecode_color=#C1D0D2
title_color=#DBE0E2
time_pos_color=#DBE0E2
time_pos_outline_color=#151A1E
buttons_color=#DBE0E2
small_buttonsL_color=#DBE0E2
small_buttonsR_color=#DBE0E2
top_buttons_color=#DBE0E2
held_element_color=#8E999E

# Tracks open as lists on a plain click; the wheel still cycles them.
audio_track_mbtn_left_command=script-binding select/select-aid; script-message-to osc osc-hide
sub_track_mbtn_left_command=script-binding select/select-sid; script-message-to osc osc-hide

# Technical truth is one action away: the title or "Playback details" (or Tab).
title_mbtn_left_command=script-binding demimedia_details/toggle
custom_button_1_content=Playback details
custom_button_1_mbtn_left_command=script-binding demimedia_details/toggle
